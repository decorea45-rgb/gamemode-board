name: Update odds boards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-board.yml"
  schedule:
    - cron: "17,47 * * * *"
    - cron: "27,57 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: gamemode-board-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Decide whether fallback refresh is needed
        id: refresh_gate
        shell: bash
        run: |
          run_refresh=true
          trigger_schedule="${{ github.event.schedule }}"
          echo "Trigger event=${{ github.event_name }} schedule=${trigger_schedule:-n/a}"

          # Only a COMPLETE six-league marker may suppress the guarded fallback.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$trigger_schedule" = "27,57 * * * *" ]; then
            if [ -f last-successful-refresh.txt ]; then
              last_success="$(head -n1 last-successful-refresh.txt | tr -d '\r\n')"
              last_epoch="$(date -u -d "$last_success" +%s 2>/dev/null || echo 0)"
              now_epoch="$(date -u +%s)"
              age_seconds=$((now_epoch - last_epoch))
              echo "Fallback complete-refresh check: last_success=${last_success:-missing} age_seconds=${age_seconds}"
              if [ "$last_epoch" -gt 0 ] && [ "$age_seconds" -ge 0 ] && [ "$age_seconds" -lt 1200 ]; then
                run_refresh=false
                echo "Recent complete six-league refresh exists; fallback exits cleanly."
              fi
            else
              echo "No complete-refresh marker exists; fallback will run."
            fi
          fi
          echo "run_refresh=$run_refresh" >> "$GITHUB_OUTPUT"

      - name: Verify deployed GameMode backend and provider gate
        if: steps.refresh_gate.outputs.run_refresh == 'true'
        shell: bash
        run: |
          expected="1.5.4"
          for attempt in $(seq 1 16); do
            health="$(curl -fsSL --connect-timeout 15 --max-time 30 https://gamemode-80wa.onrender.com/health || true)"
            version="$(printf '%s' "$health" | sed -n 's/.*"boardVersion"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
            circuit="$(printf '%s' "$health" | sed -n 's/.*"providerCircuitOpen"[[:space:]]*:[[:space:]]*\(true\|false\).*/\1/p')"
            retry="$(printf '%s' "$health" | sed -n 's/.*"providerRetryAfterSeconds"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p')"
            echo "BACKEND PREFLIGHT attempt=${attempt} expected=${expected} observed=${version:-unavailable} circuit=${circuit:-unknown} retry=${retry:-0}s"
            if [ "$version" = "$expected" ]; then
              echo "Deployed GameMode backend ${expected} confirmed. Provider state will be handled fail-fast by /board."
              sleep 5
              exit 0
            fi
            sleep 15
          done
          echo "::error::GameMode backend ${expected} was not observed in time."
          exit 1

      - name: Fetch compact framework odds boards with circuit-aware recovery
        if: steps.refresh_gate.outputs.run_refresh == 'true'
        shell: bash
        run: |
          rm -f .refresh-failed .refresh-attempts .refresh-success .provider-degraded
          provider_stop=false

          mark_failed () {
            league="$1"
            file="$2"
            label="$3"
            grep -qx "$league" .refresh-failed 2>/dev/null || echo "$league" >> .refresh-failed
            echo "::error::${label} refresh unavailable; preserving previous ${file}."
          }

          fetch_board () {
            league="$1"
            file="$2"
            label="$3"

            if [ "$provider_stop" = "true" ]; then
              mark_failed "$league" "$file" "$label"
              echo "Skipping ${label}: provider circuit already confirmed degraded in this run."
              return 0
            fi

            success=false
            for attempt in 1 2; do
              rm -f full-board.html "${file}.new" response-headers.txt
              http_code="$(curl -sS -L --connect-timeout 20 --max-time 90 \
                -D response-headers.txt -o full-board.html -w '%{http_code}' \
                "https://gamemode-80wa.onrender.com/board?leagueID=${league}&windowHours=36" || true)"
              [ -n "$http_code" ] || http_code="000"
              provider_state="$(awk 'BEGIN{IGNORECASE=1} /^x-gamemode-provider-state:/ {gsub("\r",""); print $2}' response-headers.txt | tail -n1)"
              retry_after="$(awk 'BEGIN{IGNORECASE=1} /^retry-after:/ {gsub("\r",""); print $2}' response-headers.txt | tail -n1)"
              echo "${league}:${http_code}:${provider_state:-n/a}:${retry_after:-0}" >> .refresh-attempts
              echo "FETCH ${label}: attempt=${attempt} http=${http_code} provider=${provider_state:-n/a} retry=${retry_after:-0}s"

              if [ "$http_code" = "200" ] && [ -s full-board.html ]; then
                updated="$(sed -n 's/.*<strong>Updated:<\/strong>[[:space:]]*\([^<]*\).*/\1/p' full-board.html | head -n1)"
                board_state="$(sed -n 's/.*<strong>Board State:<\/strong>[[:space:]]*\([^<]*\).*/\1/p' full-board.html | head -n1)"
                event_count="$(sed -n 's/.*<strong>Event Count:<\/strong>[[:space:]]*\([0-9][0-9]*\).*/\1/p' full-board.html | head -n1)"
                coverage="$(sed -n 's/.*<strong>Coverage Complete:<\/strong>[[:space:]]*\([^<]*\).*/\1/p' full-board.html | head -n1)"
                pages="$(sed -n 's/.*<strong>Pages Fetched:<\/strong>[[:space:]]*\([0-9][0-9]*\).*/\1/p' full-board.html | head -n1)"
                window="$(sed -n 's/.*<strong>Window Hours:<\/strong>[[:space:]]*\([0-9][0-9]*\).*/\1/p' full-board.html | head -n1)"
                source_mode="$(sed -n 's/.*<strong>Source Mode:<\/strong>[[:space:]]*\([^<]*\).*/\1/p' full-board.html | head -n1)"
                matchup_count="$(grep -c '<h2>' full-board.html || true)"
                echo "ACCEPTANCE ${label}: updated=${updated:-missing} state=${board_state:-missing} events=${event_count:-missing} matchups=${matchup_count:-0} coverage=${coverage:-missing} pages=${pages:-missing} windowHours=${window:-missing} sourceMode=${source_mode:-missing}"

                metadata_ok=true
                if [ -z "$updated" ] || ! [[ "$event_count" =~ ^[0-9]+$ ]] || ! [[ "$pages" =~ ^[0-9]+$ ]] || ! [[ "$window" =~ ^[0-9]+$ ]] || [ -z "$board_state" ] || [ -z "$source_mode" ]; then
                  metadata_ok=false
                elif [ "$board_state" = "unavailable" ]; then
                  if [ "$source_mode" != "provider-entitlement-unavailable" ] || [ "$event_count" -ne 0 ] || [ "$pages" -ne 0 ] || [ "$coverage" != "n/a" ] || [ "$matchup_count" -ne 0 ]; then
                    metadata_ok=false
                  fi
                elif [ "$coverage" != "yes" ] || [ "$event_count" -ne "$matchup_count" ]; then
                  metadata_ok=false
                fi

                if [ "$metadata_ok" = "true" ]; then
                  {
                    printf '<!doctype html>\n<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>GameMode %s Odds Board</title></head><body>\n' "$label"
                    printf '<h1>GameMode %s Odds Board</h1>\n<p>Compact read-only market snapshot.</p>\n<p>Generated: %s</p>\n<pre>\n' "$label" "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
                    grep -E '<strong>Updated:</strong>|<strong>Board State:</strong>|<strong>Event Count:</strong>|<strong>Coverage Complete:</strong>|<strong>Pages Fetched:</strong>|<strong>Window Hours:</strong>|<strong>Source Mode:</strong>|<strong>Provider Status:</strong>|<h2>|<strong>Start:</strong>|"marketName"|"odds"|"bookOdds"|"fairOdds"|"spread"|"overUnder"|"available"|"deeplink"|"fanduel"' full-board.html || true
                    printf '</pre></body></html>\n'
                  } > "${file}.new"
                  mv "${file}.new" "$file"
                  echo "$league" >> .refresh-success
                  success=true
                  echo "RECOVERED ${label}: accepted on attempt ${attempt}."
                  break
                fi
              fi

              # Backend 1.5.4 opens its provider circuit and returns immediately.
              # A cooldown response therefore confirms provider-wide degradation;
              # do not wait/retry at workflow level or hit five more leagues.
              if [ "$provider_state" = "cooldown" ] || [ "$http_code" = "429" ]; then
                provider_stop=true
                touch .provider-degraded
                echo "Provider circuit confirmed degraded by ${label}; suppressing remaining upstream calls this run."
                break
              fi

              if [ "$attempt" -lt 2 ]; then
                if [[ "$retry_after" =~ ^[0-9]+$ ]] && [ "$retry_after" -gt 0 ]; then
                  delay="$retry_after"
                  [ "$delay" -lt 30 ] && delay=30
                  [ "$delay" -gt 180 ] && delay=180
                elif [ "$http_code" = "503" ]; then
                  delay=60
                else
                  delay=30
                fi
                echo "Non-circuit cooldown for ${label}: ${delay}s before final attempt."
                sleep "$delay"
              fi
            done

            rm -f full-board.html "${file}.new" response-headers.txt
            if [ "$success" != "true" ]; then mark_failed "$league" "$file" "$label"; fi
          }

          space_if_open () { if [ "$provider_stop" != "true" ]; then sleep 10; fi; }
          fetch_board MLB mlb.html MLB
          space_if_open
          fetch_board NFL nfl.html NFL
          space_if_open
          fetch_board NBA nba.html NBA
          space_if_open
          fetch_board WNBA wnba.html WNBA
          space_if_open
          fetch_board NCAAF ncaaf.html "College Football"
          space_if_open
          fetch_board NCAAB ncaab.html "College Basketball"

      - name: Capture WNBA diagnostics only when useful
        if: steps.refresh_gate.outputs.run_refresh == 'true'
        shell: bash
        run: |
          if [ -f .provider-degraded ]; then
            echo "Provider circuit already confirmed degraded; no WNBA diagnostic traffic added."
          elif [ -f .refresh-failed ] && grep -qx 'WNBA' .refresh-failed; then
            curl -fsSL --connect-timeout 20 --max-time 120 \
              "https://gamemode-80wa.onrender.com/diagnostics/board?leagueID=WNBA&windowHours=36" \
              || echo "::warning::WNBA diagnostic endpoint unavailable"
          else
            echo "WNBA did not require diagnostics."
          fi

      - name: Record refresh state and build index
        if: steps.refresh_gate.outputs.run_refresh == 'true'
        shell: bash
        run: |
          attempt_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [ -f .refresh-success ]; then success_count="$(wc -l < .refresh-success)"; else success_count=0; fi
          if [ ! -f .refresh-failed ]; then
            printf '%s\n' "$attempt_time" > last-successful-refresh.txt
            refresh_state="COMPLETE"
          else
            refresh_state="PARTIAL/FAILED"
          fi

          last_success="never"
          if [ -f last-successful-refresh.txt ]; then last_success="$(head -n1 last-successful-refresh.txt | tr -d '\r\n')"; fi

          # Zero-success provider failures preserve the public index as well as boards.
          if [ "$success_count" -eq 0 ] && [ "$refresh_state" != "COMPLETE" ]; then
            echo "No league refreshed successfully; preserving public index and all prior boards."
            exit 0
          fi

          version="$(date -u +%Y%m%d%H%M%S)"
          cat > index.html <<EOF
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>GameMode Sports Odds Board</title></head><body>
          <h1>GameMode Sports Odds Board</h1><p>Public read-only compact market snapshots.</p>
          <p>Last refresh attempt: ${attempt_time}</p><p>Attempt state: ${refresh_state}</p><p>Last complete six-league refresh: ${last_success}</p><p>Per-league Updated timestamps are authoritative for league freshness.</p><ul>
          <li><a href="mlb.html?v=${version}">MLB</a></li><li><a href="nfl.html?v=${version}">NFL</a></li><li><a href="nba.html?v=${version}">NBA</a></li><li><a href="wnba.html?v=${version}">WNBA</a></li><li><a href="ncaaf.html?v=${version}">College Football</a></li><li><a href="ncaab.html?v=${version}">College Basketball</a></li>
          </ul></body></html>
          EOF

      - name: Publish updated boards
        if: steps.refresh_gate.outputs.run_refresh == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mlb.html nfl.html nba.html wnba.html ncaaf.html ncaab.html
          if [ -f last-successful-refresh.txt ]; then git add last-successful-refresh.txt; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update compact odds boards"
            git pull --rebase origin main
            git push
          else
            git fetch origin main
          fi

      - name: Verify refresh completeness
        if: steps.refresh_gate.outputs.run_refresh == 'true'
        shell: bash
        run: |
          if [ -f .refresh-failed ]; then
            echo "Failed leagues after recovery attempts:"
            cat .refresh-failed
            if [ -f .provider-degraded ]; then echo "Provider circuit confirmed degraded; remaining calls were suppressed to protect recovery."; fi
            echo "Complete-refresh marker was NOT advanced; previous valid failed-league boards remain authoritative."
            exit 1
          fi
          echo "All six league refreshes completed with valid metadata. Complete-refresh marker advanced."

      - name: Guarded fallback skipped
        if: steps.refresh_gate.outputs.run_refresh != 'true'
        shell: bash
        run: |
          echo "Fallback schedule fired, but a recent COMPLETE six-league refresh already exists."