name: Update odds boards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch framework odds boards
        run: |
curl -fL --retry 3 "https://gamemode-80wa.onrender.com/board?leagueID=MLB" -o mlb.html || true
curl -fL --retry 3 "https://gamemode-80wa.onrender.com/board?leagueID=NFL" -o nfl.html || true
curl -fL --retry 3 "https://gamemode-80wa.onrender.com/board?leagueID=NBA" -o nba.html || true
curl -fL --retry 3 "https://gamemode-80wa.onrender.com/board?leagueID=WNBA" -o wnba.html || true
curl -fL --retry 3 "https://gamemode-80wa.onrender.com/board?leagueID=NCAAF" -o ncaaf.html || true
curl -fL --retry 3 "https://gamemode-80wa.onrender.com/board?leagueID=NCAAB" -o ncaab.html || true
      - name: Build index page
        run: |
          cat > index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>GameMode Sports Odds Board</title>
          </head>
          <body>
            <h1>GameMode Sports Odds Board</h1>
            <p>Public read-only market snapshots for the betting framework.</p>
            <ul>
              <li><a href="mlb.html">MLB</a></li>
              <li><a href="nfl.html">NFL</a></li>
              <li><a href="nba.html">NBA</a></li>
              <li><a href="wnba.html">WNBA</a></li>
              <li><a href="ncaaf.html">College Football</a></li>
              <li><a href="ncaab.html">College Basketball</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Publish updated boards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mlb.html nfl.html nba.html wnba.html ncaaf.html ncaab.html
          git diff --cached --quiet || git commit -m "Update framework odds boards"
          git push
