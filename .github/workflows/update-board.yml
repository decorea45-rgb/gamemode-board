name: Update odds boards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch compact framework odds boards
        shell: bash
        run: |
          fetch_board () {
            league="$1"
            file="$2"
            label="$3"

            if curl -fL --retry 3 --max-time 90 \
              "https://gamemode-80wa.onrender.com/board?leagueID=${league}" \
              -o full-board.html; then

              head -c 400000 full-board.html > "$file"
              printf '\n</body></html>\n' >> "$file"
              echo "${label} board updated"
            else
              printf '<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="index,follow"><title>%s Odds Board</title></head><body><h1>%s Odds Board</h1><p>Board currently unavailable.</p></body></html>\n' \
                "$label" "$label" > "$file"
            fi

            rm -f full-board.html
          }

          fetch_board MLB mlb.html MLB
          fetch_board NFL nfl.html NFL
          fetch_board NBA nba.html NBA
          fetch_board WNBA wnba.html WNBA
          fetch_board NCAAF ncaaf.html "College Football"
          fetch_board NCAAB ncaab.html "College Basketball"

      - name: Build index page
        run: |
          printf '%s\n' \
            '<!doctype html>' \
            '<html>' \
            '<head>' \
            '<meta charset="utf-8">' \
            '<meta name="viewport" content="width=device-width,initial-scale=1">' \
            '<meta name="robots" content="index,follow">' \
            '<title>GameMode Sports Odds Board</title>' \
            '</head>' \
            '<body>' \
            '<h1>GameMode Sports Odds Board</h1>' \
            '<p>Public read-only market snapshots.</p>' \
            '<ul>' \
            '<li><a href="mlb.html">MLB</a></li>' \
            '<li><a href="nfl.html">NFL</a></li>' \
            '<li><a href="nba.html">NBA</a></li>' \
            '<li><a href="wnba.html">WNBA</a></li>' \
            '<li><a href="ncaaf.html">College Football</a></li>' \
            '<li><a href="ncaab.html">College Basketball</a></li>' \
            '</ul>' \
            '</body>' \
            '</html>' > index.html

      - name: Publish updated boards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mlb.html nfl.html nba.html wnba.html ncaaf.html ncaab.html
          git diff --cached --quiet || git commit -m "Update compact sports odds boards"
          git push
