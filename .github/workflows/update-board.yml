name: Update odds boards

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch compact framework odds boards
        shell: bash
        run: |
          fetch_board () {
            league="$1"
            file="$2"
            label="$3"

            if curl -fL --retry 3 --max-time 90 \
              "https://gamemode-80wa.onrender.com/board?leagueID=${league}" \
              -o full-board.html; then

              {
                printf '<!doctype html>\n'
                printf '<html>\n'
                printf '<head>\n'
                printf '  <meta charset="utf-8">\n'
                printf '  <meta name="viewport" content="width=device-width, initial-scale=1">\n'
                printf '  <meta name="robots" content="index,follow">\n'
                printf '  <title>GameMode %s Odds Board</title>\n' "$label"
                printf '</head>\n'
                printf '<body>\n'
                printf '  <h1>GameMode %s Odds Board</h1>\n' "$label"
                printf '  <p>Compact read-only market snapshot.</p>\n'
                printf '  <p>Generated: %s</p>\n' "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
                printf '  <pre>\n'

                grep -E \
                  '<h2>|<strong>Start:</strong>|"marketName"|"odds"|"bookOdds"|"fairOdds"|"spread"|"overUnder"|"available"|"deeplink"|"fanduel"' \
                   full-board.html || true

                printf '  </pre>\n'
                printf '</body>\n'
                printf '</html>\n'
              } > "$file"

              echo "${label} board updated"
            else
              printf '<!doctype html><html><body><h1>%s Odds Board</h1><p>Board currently unavailable.</p></body></html>\n' \
                "$label" > "$file"
            fi

            rm -f full-board.html
          }

          fetch_board MLB mlb.html MLB
          fetch_board NFL nfl.html NFL
          fetch_board NBA nba.html NBA
          fetch_board WNBA wnba.html WNBA
          fetch_board NCAAF ncaaf.html "College Football"
          fetch_board NCAAB ncaab.html "College Basketball"

      - name: Build index page
        shell: bash
        run: |
          printf '%s\n' \
            '<!doctype html>' \
            '<html>' \
            '<head>' \
            '  <meta charset="utf-8">' \
            '  <meta name="viewport" content="width=device-width, initial-scale=1">' \
            '  <meta name="robots" content="index,follow">' \
            '  <title>GameMode Sports Odds Board</title>' \
            '</head>' \
            '<body>' \
            '  <h1>GameMode Sports Odds Board</h1>' \
            '  <p>Public read-only compact market snapshots.</p>' \
            '  <ul>' \
            '    <li><a href="mlb.html">MLB</a></li>' \
            '    <li><a href="nfl.html">NFL</a></li>' \
            '    <li><a href="nba.html">NBA</a></li>' \
            '    <li><a href="wnba.html">WNBA</a></li>' \
            '    <li><a href="ncaaf.html">College Football</a></li>' \
            '    <li><a href="ncaab.html">College Basketball</a></li>' \
            '  </ul>' \
            '</body>' \
            '</html>' > index.html

      - name: Publish updated boards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mlb.html nfl.html nba.html wnba.html ncaaf.html ncaab.html
          git diff --cached --quiet || git commit -m "Update compact odds boards"
          git push
