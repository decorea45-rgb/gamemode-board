name: Update odds boards

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: gamemode-board-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Fetch compact framework odds boards
        shell: bash
        run: |
          rm -f .refresh-failed

          fetch_board () {
            league="$1"
            file="$2"
            label="$3"

            if curl -fL --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 --connect-timeout 20 --max-time 240 \
              "https://gamemode-80wa.onrender.com/board?leagueID=${league}&windowHours=36" \
              -o full-board.html; then

              updated="$(sed -n 's/.*<strong>Updated:<\/strong>[[:space:]]*\([^<]*\).*/\1/p' full-board.html | head -n1)"
              event_count="$(sed -n 's/.*<strong>Event Count:<\/strong>[[:space:]]*\([0-9][0-9]*\).*/\1/p' full-board.html | head -n1)"
              coverage="$(sed -n 's/.*<strong>Coverage Complete:<\/strong>[[:space:]]*\([^<]*\).*/\1/p' full-board.html | head -n1)"
              pages="$(sed -n 's/.*<strong>Pages Fetched:<\/strong>[[:space:]]*\([0-9][0-9]*\).*/\1/p' full-board.html | head -n1)"
              window="$(sed -n 's/.*<strong>Window Hours:<\/strong>[[:space:]]*\([0-9][0-9]*\).*/\1/p' full-board.html | head -n1)"
              matchup_count="$(grep -c '<h2>' full-board.html || true)"

              echo "ACCEPTANCE ${label}: updated=${updated:-missing} events=${event_count:-missing} matchups=${matchup_count:-0} coverage=${coverage:-missing} pages=${pages:-missing} windowHours=${window:-missing} bytes=$(wc -c < full-board.html)"

              if [ "$coverage" != "yes" ]; then
                echo "::warning::${label} board reported incomplete pagination; preserving previous ${file}"
                touch .refresh-failed
                rm -f full-board.html "${file}.new"
                return 0
              fi

              if ! [[ "$event_count" =~ ^[0-9]+$ ]] || ! [[ "$pages" =~ ^[0-9]+$ ]] || ! [[ "$window" =~ ^[0-9]+$ ]]; then
                echo "::warning::${label} board metadata was malformed or missing; preserving previous ${file}"
                touch .refresh-failed
                rm -f full-board.html "${file}.new"
                return 0
              fi

              if [ "$event_count" -ne "$matchup_count" ]; then
                echo "::warning::${label} event-count/matchup-count mismatch (${event_count} vs ${matchup_count}); preserving previous ${file}"
                touch .refresh-failed
                rm -f full-board.html "${file}.new"
                return 0
              fi

              {
                printf '<!doctype html>\n'
                printf '<html>\n'
                printf '<head>\n'
                printf '  <meta charset="utf-8">\n'
                printf '  <meta name="viewport" content="width=device-width, initial-scale=1">\n'
                printf '  <meta name="robots" content="index,follow">\n'
                printf '  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">\n'
                printf '  <meta http-equiv="Pragma" content="no-cache">\n'
                printf '  <meta http-equiv="Expires" content="0">\n'
                printf '  <title>GameMode %s Odds Board</title>\n' "$label"
                printf '</head>\n'
                printf '<body>\n'
                printf '  <h1>GameMode %s Odds Board</h1>\n' "$label"
                printf '  <p>Compact read-only market snapshot.</p>\n'
                printf '  <p>Generated: %s</p>\n' "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
                printf '  <pre>\n'

                grep -E \
                  '<strong>Updated:</strong>|<strong>Event Count:</strong>|<strong>Coverage Complete:</strong>|<strong>Pages Fetched:</strong>|<strong>Window Hours:</strong>|<h2>|<strong>Start:</strong>|"marketName"|"odds"|"bookOdds"|"fairOdds"|"spread"|"overUnder"|"available"|"deeplink"|"fanduel"' \
                  full-board.html || true

                printf '  </pre>\n'
                printf '</body>\n'
                printf '</html>\n'
              } > "${file}.new"

              mv "${file}.new" "$file"
              echo "${label} board updated"
            else
              echo "::warning::${label} fetch failed after retries; preserving previous ${file} instead of overwriting it"
              touch .refresh-failed
            fi

            rm -f full-board.html "${file}.new"
          }

          fetch_board MLB mlb.html MLB
          fetch_board NFL nfl.html NFL
          fetch_board NBA nba.html NBA
          fetch_board WNBA wnba.html WNBA
          fetch_board NCAAF ncaaf.html "College Football"
          fetch_board NCAAB ncaab.html "College Basketball"

      - name: Build index page
        shell: bash
        run: |
          version="$(date -u +%Y%m%d%H%M%S)"
          printf '%s\n' \
            '<!doctype html>' \
            '<html>' \
            '<head>' \
            '  <meta charset="utf-8">' \
            '  <meta name="viewport" content="width=device-width, initial-scale=1">' \
            '  <meta name="robots" content="index,follow">' \
            '  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">' \
            '  <meta http-equiv="Pragma" content="no-cache">' \
            '  <meta http-equiv="Expires" content="0">' \
            '  <title>GameMode Sports Odds Board</title>' \
            '</head>' \
            '<body>' \
            '  <h1>GameMode Sports Odds Board</h1>' \
            '  <p>Public read-only compact market snapshots.</p>' \
            "  <p>Index generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')</p>" \
            '  <ul>' \
            "    <li><a href=\"mlb.html?v=${version}\">MLB</a></li>" \
            "    <li><a href=\"nfl.html?v=${version}\">NFL</a></li>" \
            "    <li><a href=\"nba.html?v=${version}\">NBA</a></li>" \
            "    <li><a href=\"wnba.html?v=${version}\">WNBA</a></li>" \
            "    <li><a href=\"ncaaf.html?v=${version}\">College Football</a></li>" \
            "    <li><a href=\"ncaab.html?v=${version}\">College Basketball</a></li>" \
            '  </ul>' \
            '</body>' \
            '</html>' > index.html

      - name: Publish updated boards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mlb.html nfl.html nba.html wnba.html ncaaf.html ncaab.html
          git diff --cached --quiet || git commit -m "Update compact odds boards"
          git push

      - name: Verify refresh completeness
        shell: bash
        run: |
          if [ -f .refresh-failed ]; then
            echo "One or more league refreshes failed or were incomplete. Successful league updates were published and prior valid boards were preserved for failed leagues."
            exit 1
          fi
          echo "All league refreshes completed with valid board metadata."
